<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสั่งงาน — ซักผ้าเชียงใหม่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A32;
    --ink-soft:#54666F;
    --line:#DCE6EA;
    --paper:#F4F8F9;
    --card:#FFFFFF;
    --blue:#2F6690;
    --blue-deep:#204A65;
    --blue-wash:#E7F0F4;
    --saffron:#D9902F;
    --saffron-deep:#B87421;
    --saffron-wash:#FBF0DF;
    --sage:#5E8C6A;
    --sage-wash:#E9F3EB;
    --danger:#B5533C;
    --radius-s:6px;
    --radius-m:10px;
    --shadow-card:0 1px 2px rgba(30,42,50,0.06), 0 1px 0 rgba(30,42,50,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Prompt',sans-serif;
    font-weight:600;
    color:var(--blue-deep);
    margin:0;
  }
  button{font-family:inherit;}
  ::selection{background:var(--saffron-wash);}

  /* ---------- App shell ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:18px 18px 96px;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:6px 2px 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .brandmark{
    width:42px;height:42px;flex:none;
    border-radius:11px;
    background:linear-gradient(155deg,var(--blue) 0%,var(--blue-deep) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .brandmark svg{width:24px;height:24px;}
  .brandmark-logo{background:#fff;border:1px solid var(--line);padding:4px;}
  .brandmark-logo img{width:100%;height:100%;object-fit:contain;}
  .rc-logo{display:block;margin:0 auto 6px;max-width:160px;height:auto;}
  .brand-text{flex:1;min-width:0;}
  .brand-text h1{font-size:19px;letter-spacing:.1px;}
  .brand-text p{margin:1px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .tabs{display:flex;gap:4px;background:var(--blue-wash);padding:4px;border-radius:10px;flex:none;}
  .tab-btn{
    border:none;background:transparent;
    padding:8px 16px;border-radius:7px;
    font-size:14px;font-weight:600;color:var(--blue-deep);
    cursor:pointer;transition:background .15s ease, color .15s ease;
    font-family:'Sarabun',sans-serif;
  }
  .tab-btn.active{background:var(--card);box-shadow:var(--shadow-card);}
  .tab-btn:not(.active):hover{color:var(--blue);}

  .view{display:none;}
  .view.active{display:block;}

  /* ---------- POS layout ---------- */
  .pos-grid{
    display:grid;
    grid-template-columns:270px 1fr;
    gap:18px;
    align-items:start;
  }
  @media (max-width:860px){
    .pos-grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow-card);
  }

  /* Customer picker */
  .cust-panel{padding:14px;position:sticky;top:14px;}
  .cust-search{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    font-size:14px;
    font-family:'Sarabun',sans-serif;
    margin-bottom:10px;
    background:var(--paper);
    color:var(--ink);
  }
  .cust-search:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .cust-list{
    list-style:none;margin:0;padding:0;
    max-height:520px;overflow-y:auto;
    display:flex;flex-direction:column;gap:2px;
  }
  .cust-list::-webkit-scrollbar{width:6px;}
  .cust-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .cust-item{
    border:none;background:transparent;
    text-align:right;
    width:100%;
    padding:9px 10px;
    border-radius:7px;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    font-family:'Sarabun',sans-serif;
    display:flex;justify-content:space-between;align-items:center;
    gap:8px;
  }
  .cust-item .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cust-item .cnt{font-size:11.5px;color:var(--ink-soft);flex:none;}
  .cust-item:hover{background:var(--blue-wash);}
  .cust-item.selected{background:var(--blue);color:#fff;}
  .cust-item.selected .cnt{color:#dbe9f2;}
  .cust-empty{padding:14px 8px;color:var(--ink-soft);font-size:13.5px;text-align:center;}

  /* Order panel */
  .order-panel{padding:0;overflow:hidden;}
  .order-head{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    flex-wrap:wrap;
  }
  .order-head h2{font-size:18px;}
  .order-head .meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .order-head .phone{font-size:12.5px;color:var(--ink-soft);}
  .datefield{
    display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);
  }
  .datefield input{
    border:1px solid var(--line);border-radius:var(--radius-s);
    padding:6px 8px;font-family:'Sarabun',sans-serif;font-size:13px;color:var(--ink);
    background:var(--paper);
  }

  .placeholder{
    padding:64px 24px;text-align:center;color:var(--ink-soft);
  }
  .placeholder svg{width:52px;height:52px;opacity:.35;margin-bottom:10px;}
  .placeholder p{margin:0;font-size:14.5px;}

  table.items{width:100%;border-collapse:collapse;}
  table.items thead th{
    text-align:right;
    font-size:12px;color:var(--ink-soft);font-weight:600;
    padding:10px 14px;border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;top:0;
  }
  table.items thead th:first-child{text-align:right;}
  table.items thead th.col-name{text-align:right;width:38%;}
  table.items tbody td{
    padding:9px 14px;border-bottom:1px solid var(--line);
    font-size:14px;vertical-align:middle;
  }
  table.items tbody tr:last-child td{border-bottom:none;}
  table.items tbody tr.has-qty{background:var(--sage-wash);}
  td.col-name{font-weight:500;}
  td.col-name .unit-note{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:400;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .qty-wrap{display:flex;align-items:center;justify-content:flex-end;gap:6px;}
  .qty-btn{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--blue-deep);font-size:15px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-family:'Sarabun',sans-serif;font-weight:600;
  }
  .qty-btn:hover{background:var(--blue-wash);}
  .qty-input{
    width:48px;text-align:center;border:1px solid var(--line);border-radius:6px;
    padding:4px 2px;font-size:14px;font-family:'Sarabun',sans-serif;color:var(--ink);
    -moz-appearance:textfield;
  }
  .qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .line-total{font-weight:600;color:var(--blue-deep);}
  .remove-row{
    border:none;background:transparent;color:var(--ink-soft);cursor:pointer;
    font-size:16px;padding:2px 4px;border-radius:5px;
  }
  .remove-row:hover{color:var(--danger);background:var(--saffron-wash);}

  .addline{
    display:flex;gap:8px;padding:12px 14px;border-top:1px dashed var(--line);
    flex-wrap:wrap;
  }
  .addline input{
    border:1px solid var(--line);border-radius:var(--radius-s);
    padding:8px 10px;font-family:'Sarabun',sans-serif;font-size:13.5px;color:var(--ink);
    background:var(--paper);
  }
  .addline input.iname{flex:1;min-width:140px;}
  .addline input.iprice{width:90px;}
  .addline input.iqty{width:70px;}
  .addline button{
    border:1px solid var(--blue);background:var(--blue-wash);color:var(--blue-deep);
    border-radius:var(--radius-s);padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .addline button:hover{background:var(--blue);color:#fff;}

  /* Summary bar */
  .summary{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;
    padding:16px 18px;
    background:var(--blue-deep);
    color:#fff;
  }
  .summary .totals{display:flex;flex-direction:column;gap:2px;}
  .summary .baht-text{font-size:12px;color:#BFD6E4;}
  .summary .amount{font-family:'Prompt',sans-serif;font-size:24px;font-weight:600;}
  .summary .amount span{font-size:14px;font-weight:500;margin-right:4px;color:#BFD6E4;font-family:'Sarabun',sans-serif;}
  .summary .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:var(--radius-s);padding:10px 16px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
    transition:filter .12s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-ghost{background:rgba(255,255,255,0.12);color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,0.2);}
  .btn-primary{background:var(--saffron);color:#332006;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;
    font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.18);
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast{display:flex;align-items:center;gap:12px;}
  .toast-btn{
    border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
    border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
    font-family:'Sarabun',sans-serif;flex:none;white-space:nowrap;
  }
  .toast-btn:hover{background:rgba(255,255,255,.15);}

  /* ---------- History view ---------- */
  .hist-summary{
    display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;
  }
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:14px 18px;box-shadow:var(--shadow-card);flex:1;min-width:150px;
  }
  .stat-card .label{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .stat-card .value{font-family:'Prompt',sans-serif;font-size:22px;font-weight:600;color:var(--blue-deep);}

  .kbd-hint{font-size:11.5px;color:var(--ink-soft);width:100%;margin-top:2px;}

  .hist-toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:12px 14px;box-shadow:var(--shadow-card);
  }
  .hist-toolbar label{font-size:12.5px;color:var(--ink-soft);}
  .hist-toolbar select{
    font-family:'Sarabun',sans-serif;font-size:14px;padding:7px 10px;
    border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);
  }
  .btn-export{
    margin-left:auto;border:none;background:var(--blue-deep);color:#fff;
    border-radius:8px;padding:9px 16px;font-size:13.5px;cursor:pointer;
    font-family:'Sarabun',sans-serif;font-weight:600;
  }
  .btn-export:hover{filter:brightness(1.08);}
  .btn-export:disabled{opacity:.45;cursor:not-allowed;}
  .btn-copy{
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;font-family:'Sarabun',sans-serif;
  }
  .btn-copy:hover{background:var(--blue-wash);}

  .hist-list{display:flex;flex-direction:column;gap:10px;}
  .hist-row{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:13px 16px;box-shadow:var(--shadow-card);
    cursor:pointer;
  }
  .hist-row-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .hist-row-top .cust{font-weight:600;font-size:15px;color:var(--ink);}
  .hist-row-top .date{font-size:12.5px;color:var(--ink-soft);}
  .hist-row-top .amt{font-family:'Prompt',sans-serif;font-weight:600;color:var(--blue-deep);font-size:16px;}
  .hist-detail{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    display:none;font-size:13.5px;
  }
  .hist-row.open .hist-detail{display:block;}
  .hist-detail table{width:100%;border-collapse:collapse;}
  .hist-detail td{padding:4px 0;color:var(--ink-soft);}
  .hist-detail td.hn{color:var(--ink);}
  .hist-detail td.hn .hp{color:#888;font-size:11px;}
  .hist-detail td.ht{text-align:right;font-variant-numeric:tabular-nums;}
  .hist-actions{margin-top:10px;display:flex;gap:8px;}
  .hist-actions button{
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:6px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:'Sarabun',sans-serif;
  }
  .hist-actions button:hover{background:var(--blue-wash);}
  .hist-actions button.del:hover{background:var(--saffron-wash);color:var(--danger);}
  .hist-empty{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }

  /* ---------- Receipt (58mm thermal slip) ---------- */
  #receipt{display:none;}
  .receipt-sheet{
    width:340px;margin:0 auto;background:#fff;color:#12181c;
    font-family:'Sarabun',sans-serif;padding:22px 20px 26px;
    font-size:14.5px;
  }
  .receipt-sheet h2{font-size:20px;color:#12181c;text-align:center;font-family:'Prompt',sans-serif;margin:0 0 2px;white-space:nowrap;letter-spacing:-0.2px;}
  .receipt-sheet .rc-shop{font-size:13.5px;text-align:center;color:#444;}
  .receipt-sheet .rc-line{border-top:1px dashed #999;margin:8px 0;}
  .receipt-sheet .rc-center{text-align:center;}
  .receipt-sheet .rc-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;}
  .receipt-sheet .rc-items{margin-top:4px;}
  .receipt-sheet .rc-item{padding:3px 0;}
  .receipt-sheet .rc-item-name{font-size:14px;}
  .receipt-sheet .rc-item-sub{display:flex;justify-content:space-between;font-size:13.5px;color:#333;}
  .receipt-sheet table.rc-table{width:100%;border-collapse:collapse;font-size:13px;}
  .receipt-sheet table.rc-table th{border-bottom:1px dashed #999;padding:0 0 3px;font-weight:600;color:#333;text-align:right;}
  .receipt-sheet table.rc-table th:first-child{text-align:left;}
  .receipt-sheet table.rc-table td{padding:3px 0;vertical-align:top;text-align:right;}
  .receipt-sheet table.rc-table td:first-child{text-align:left;word-break:break-word;}
  .receipt-sheet table.rc-table td.rc-qty{white-space:nowrap;}
  .receipt-sheet .rc-total{font-size:16.5px;font-weight:700;font-family:'Prompt',sans-serif;}
  .receipt-sheet .rc-baht{font-size:13.5px;margin-top:2px;}
  .receipt-sheet .rc-footer{margin-top:12px;text-align:center;font-size:13.5px;color:#444;}

  /* Screen preview keeps a comfortable card width; @page + print rules below
     rescale the same markup to a real 58mm thermal roll when actually printed. */
  #printSizeNote{
    display:flex;align-items:center;gap:8px;justify-content:center;
    padding:8px 14px 0;font-size:12px;color:var(--ink-soft);
  }

  @page{ size: 58mm auto; margin: 0; }
  @media print{
    html,body{width:58mm;}
    body *{visibility:hidden;}
    #receipt, #receipt *{visibility:visible;}
    #receipt{
      display:block;position:absolute;left:0;top:0;
      width:58mm;
    }
    .receipt-sheet{
      width:58mm;
      max-width:58mm;
      margin:0;
      padding:2mm 3mm 5mm;
      font-size:12px;
      font-weight:700;
      color:#000;
      box-sizing:border-box;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .receipt-sheet *{color:#000 !important;border-color:#000 !important;}
    .receipt-sheet h2{
      font-size:16px;font-weight:800;
      white-space:nowrap;letter-spacing:-0.3px;
      margin:0 -3mm 3px;padding:0 0.5mm;
    }
    .receipt-sheet .rc-shop{font-size:11.5px;font-weight:700;}
    .receipt-sheet .rc-row{font-size:12px;font-weight:700;}
    .receipt-sheet .rc-item-name{font-size:12px;font-weight:700;word-break:break-word;}
    .receipt-sheet .rc-item-sub{font-size:11.5px;font-weight:700;}
    .receipt-sheet table.rc-table{font-size:11px;font-weight:700;}
    .receipt-sheet table.rc-table th{font-weight:800;}
    .receipt-sheet .rc-total{font-size:14px;font-weight:800;}
    .receipt-sheet .rc-baht{font-size:11.5px;font-weight:700;}
    .receipt-sheet .rc-footer{font-size:11.5px;margin-top:8px;font-weight:700;}
    .receipt-sheet .rc-line{margin:6px 0;border-top-width:2px;}
    .rc-copy-break{
      page-break-after:always;
      break-after:page;
      border-top:1px dashed #000;
      margin:4mm 0;
      height:0;
    }
  }

  /* Confirm modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,30,36,.45);
    display:none;align-items:center;justify-content:center;z-index:40;padding:16px;
  }
  .modal-backdrop.show{display:flex;}
  .modal-box{
    background:#fff;border-radius:12px;max-width:400px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-preview{max-height:60vh;overflow-y:auto;border-bottom:1px solid var(--line);}
  .modal-actions{padding:14px 18px;display:flex;gap:8px;justify-content:flex-end;}
  .modal-actions .btn-secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
  .modal-actions .btn-secondary:hover{background:var(--blue-wash);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brandmark brandmark-logo" id="topbarLogo"></div>
    <div class="brand-text">
      <h1>รับซักผ้าโรงแรมเชียงใหม่</h1>
      <p>ระบบออกใบส่งของประจำวัน · โทร. 064-652-6415</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-view="view-pos">สั่งงาน</button>
      <button class="tab-btn" data-view="view-history">ประวัติ</button>
    </div>
  </div>

  <!-- ===================== POS VIEW ===================== -->
  <div class="view active" id="view-pos">
    <div class="pos-grid">

      <div class="panel cust-panel">
        <input type="text" id="custSearch" class="cust-search" placeholder="ค้นหาชื่อลูกค้า...">
        <ul class="cust-list" id="custList"></ul>
      </div>

      <div class="panel order-panel">
        <div class="order-head" id="orderHead"></div>

        <div class="placeholder" id="placeholder">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor">
            <path d="M4 4h16v16H4z" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="5" stroke-width="1.4"/>
          </svg>
          <p>เลือกชื่อลูกค้าจากรายการด้านซ้าย<br>เพื่อเริ่มกรอกรายการผ้าและจำนวน</p>
        </div>

        <div id="orderTableWrap" style="display:none; overflow-x:auto;">
          <table class="items">
            <thead>
              <tr>
                <th class="col-name">รายการ</th>
                <th>ราคา/ชิ้น</th>
                <th>จำนวน</th>
                <th>รวม</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="itemsTbody"></tbody>
          </table>
        </div>

        <div class="addline" id="addLine" style="display:none;">
          <input type="text" class="iname" id="inName" placeholder="รายการอื่น ๆ (พิมพ์ชื่อ)">
          <input type="number" class="iprice" id="inPrice" placeholder="ราคา" min="0">
          <input type="number" class="iqty" id="inQty" placeholder="จำนวน" min="0">
          <button type="button" id="btnAdd">+ เพิ่มรายการ</button>
        </div>

  var THAI_UNIT = ["","สิบ","ร้อย","พัน","หมื่น","แสน","ล้าน"];
  function thaiDigits(numStr){
    var len = numStr.length, out = "";
    for(var i=0;i<len;i++){
      var d = parseInt(numStr[i],10);
      var place = len-i-1;
      if(d===0) continue;
      if(place===0 && d===1 && len>1){ out += "เอ็ด"; }
      else if(place===1 && d===2){ out += "ยี่"+THAI_UNIT[1]; }
      else if(place===1 && d===1){ out += THAI_UNIT[1]; }
      else { out += THAI_DIGIT[d] + THAI_UNIT[place % 6 === 0 && place>0 ? 6 : place % 6]; }
    }
    return out;
  }
  function thaiBahtText(amount){
    amount = Math.round((amount||0) * 100) / 100;
    var neg = amount < 0; amount = Math.abs(amount);
    var baht = Math.floor(amount);
    var satang = Math.round((amount - baht) * 100);
    function groupText(n){
      if(n===0) return "";
      var s = String(n);
      var chunks = [];
      while(s.length>0){
        chunks.unshift(s.slice(-6));
        s = s.slice(0,-6);
      }
      var words = "";
      for(var i=0;i<chunks.length;i++){
        var c = chunks[i].replace(/^0+/,'');
        if(c==="") continue;
        words += thaiDigits(c);
        var millionGroupsLeft = chunks.length - i - 1;
        for(var m=0;m<millionGroupsLeft;m++) words += "ล้าน";
      }
      return words;
    }
    var bahtWords = baht===0 ? "ศูนย์" : groupText(baht);
    var out = (neg?"ลบ":"") + bahtWords + "บาท";
    if(satang===0){ out += "ถ้วน"; }
    else { out += groupText(satang) + "สตางค์"; }
    return out;
  }

  function appendItemRow(name, price, isCustom, customId){
    var tr = document.createElement('tr');
    var qtyVal = isCustom ?
      (state.customItems.find(function(x){return x.id===customId;})||{}).qty || 0 :
      (state.qty[name] || 0);

    var tdName = document.createElement('td');
    tdName.className = 'col-name';
    tdName.textContent = name;
    tr.appendChild(tdName);

    var tdPrice = document.createElement('td');
    tdPrice.className = 'num';
    tdPrice.textContent = fmt(price);
    tr.appendChild(tdPrice);

    var tdQty = document.createElement('td');
    tdQty.className = 'num';
    var wrap = document.createElement('div');
    wrap.className = 'qty-wrap';
    var minus = document.createElement('button');
    minus.className = 'qty-btn'; minus.type='button'; minus.textContent = '−';
    var input = document.createElement('input');
    input.type = 'number'; input.min = '0'; input.className = 'qty-input'; input.value = qtyVal;
    var plus = document.createElement('button');
    plus.className = 'qty-btn'; plus.type='button'; plus.textContent = '+';

    function setQty(v){
      v = Math.max(0, Math.round(Number(v)||0));
      input.value = v;
      if(isCustom){
        var ci = state.customItems.find(function(x){return x.id===customId;});
        if(ci){ ci.qty = v; }
      } else {
        if(v===0) delete state.qty[name]; else state.qty[name] = v;
      }
      tr.classList.toggle('has-qty', v>0);
      tdTotal.textContent = fmt(v*price);
      updateSummary();
    }
    minus.addEventListener('click', function(){ setQty((Number(input.value)||0)-1); });
    plus.addEventListener('click', function(){ setQty((Number(input.value)||0)+1); });
    input.addEventListener('input', function(){ setQty(input.value); });
    input.addEventListener('focus', function(){ setTimeout(function(){ input.select(); }, 0); });
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        setQty(input.value);
        moveQtyFocus(input, e.shiftKey ? -1 : 1);
      }else if(e.key==='ArrowDown'){
        e.preventDefault(); moveQtyFocus(input, 1);
      }else if(e.key==='ArrowUp'){
        e.preventDefault(); moveQtyFocus(input, -1);
      }
    });
    wrap.appendChild(minus); wrap.appendChild(input); wrap.appendChild(plus);
    tdQty.appendChild(wrap);
    tr.appendChild(tdQty);

    var tdTotal = document.createElement('td');
    tdTotal.className = 'num line-total';
    tdTotal.textContent = fmt(qtyVal*price);
    tr.appendChild(tdTotal);

    var tdDel = document.createElement('td');
    tdDel.className = 'num';
    if(isCustom){
      var delBtn = document.createElement('button');
      delBtn.className = 'remove-row'; delBtn.type='button'; delBtn.title='ลบรายการนี้';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', function(){
        state.customItems = state.customItems.filter(function(x){return x.id!==customId;});
        renderOrder();
      });
      tdDel.appendChild(delBtn);
    }
    tr.appendChild(tdDel);

    if(qtyVal>0) tr.classList.add('has-qty');
    el.itemsTbody.appendChild(tr);
  }

  function qtyInputs(){
    return Array.prototype.slice.call(el.itemsTbody.querySelectorAll('.qty-input'));
  }
  function moveQtyFocus(current, step){
    var list = qtyInputs();
    var i = list.indexOf(current);
    var next = list[i + step];
    if(next){ next.focus(); next.select(); }
    else if(step > 0){ el.inName.focus(); }
  }
  function focusFirstQty(){
    var list = qtyInputs();
    if(list.length){ list[0].focus(); list[0].select(); }
  }

  function addCustomLine(){
    var name = el.inName.value.trim();

    state.customItems.push({id: 'c'+(customIdSeq++), name:name, price:price, qty:qty});
    el.inName.value=''; el.inPrice.value=''; el.inQty.value='';

    el.inName.focus();

  function currentLines(){
    var lines = [];
    if(state.customer){
      DATA[state.customer].items.forEach(function(item){
        var q = state.qty[item.n] || 0;
        if(q>0) lines.push({name:item.n, price:item.p, qty:q, total:q*item.p});
      });
    }
    state.customItems.forEach(function(ci){
      if((ci.qty||0)>0) lines.push({name:ci.name, price:ci.price, qty:ci.qty, total:ci.qty*ci.price});
    });
    return lines;
  }

  /* ---------- Storage (db capability: shared order history) ---------- */
  var _dbPromise = null;
  function getDb(){
    if(!_dbPromise){
      _dbPromise = (window.claude && window.claude.use) ? window.claude.use('db').catch(function(){return null;}) : Promise.resolve(null);
    }
    return _dbPromise;
  }
  async function loadOrders(){
    try{
      var db = await getDb();
      if(!db) return [];
      var snap = await db.collection('orders').orderBy('createdAt','desc').get();
      return snap.docs.map(function(d){ return d.data(); });
    }catch(e){ return []; }
  }
  async function saveOrder(order){
    try{
      var db = await getDb();
      if(!db){ showToast('บันทึกไม่สำเร็จ (ไม่พบพื้นที่จัดเก็บ)'); return; }
      await db.collection('orders').doc(order.id).set(order);
    }catch(e){
      showToast('บันทึกไม่สำเร็จ ลองอีกครั้ง');
    }
  }
  async function deleteOrder(id){
    try{
      var db = await getDb();
      if(!db) return;
      await db.collection('orders').doc(id).delete();
      renderHistory();
    }catch(e){ showToast('ลบไม่สำเร็จ'); }
  }

  /* ---------- History ---------- */
  var THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                     'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var allOrders = [];

  function localToday(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function monthKey(iso){ return String(iso||'').slice(0,7); }
  function monthLabel(key){
    var p = key.split('-');
    return THAI_MONTHS[parseInt(p[1],10)-1]+' '+(parseInt(p[0],10)+543);
  }
  function fillMonthOptions(orders){
    var keys = [];
    orders.forEach(function(o){
      var k = monthKey(o.date);
      if(k && keys.indexOf(k)===-1) keys.push(k);
    });
    keys.sort().reverse();
    var cur = monthKey(localToday());
    if(keys.indexOf(cur)===-1) keys.unshift(cur);
    var prev = el.histMonth.value;
    el.histMonth.innerHTML = '<option value="all">ทุกเดือน</option>' +
      keys.map(function(k){ return '<option value="'+k+'">'+monthLabel(k)+'</option>'; }).join('');
    el.histMonth.value = (prev && (prev==='all' || keys.indexOf(prev)!==-1)) ? prev : cur;
  }

  async function renderHistory(){
    el.histList.innerHTML = '<div class="hist-empty">กำลังโหลด...</div>';
    allOrders = await loadOrders();
    fillMonthOptions(allOrders);
    renderHistoryList();
  }

  function selectedOrders(){
    var m = el.histMonth.value;
    if(!m || m==='all') return allOrders.slice();
    return allOrders.filter(function(o){ return monthKey(o.date)===m; });
  }

  function renderHistoryList(){
    var view = selectedOrders();
    var todayStr = localToday();
    var monthRevenue = view.reduce(function(s,o){return s+o.total;},0);
    var todayRevenue = view.filter(function(o){return o.date===todayStr;}).reduce(function(s,o){return s+o.total;},0);

    el.btnExport.disabled = view.length===0;
    el.histStats.innerHTML =
      '<div class="stat-card"><div class="label">ใบส่งของ ('+escapeHtml(label)+')</div><div class="value">'+view.length+' ใบ</div></div>'+
      '<div class="stat-card"><div class="label">ยอดรวมของงวดนี้</div><div class="value">'+fmt(monthRevenue)+' บาท</div></div>'+

      el.histList.innerHTML = '<div class="hist-empty">ยังไม่มีใบส่งของในเดือนที่เลือก<br>เริ่มออกใบส่งของได้ที่แท็บ “สั่งงาน”</div>';

    el.histList.innerHTML = '';
    view.forEach(function(o){
      var row = document.createElement('div');
      row.className = 'hist-row';
      var rowsHtml = o.lines.map(function(l){
        return '<tr><td class="hn">'+escapeHtml(l.name)+' × '+l.qty+' <span class="hp">('+fmt(l.price)+' บ./ชิ้น)</span></td><td class="ht">'+fmt(l.total)+' บ.</td></tr>';
      }).join('');
      row.innerHTML =
        '<div class="hist-row-top">'+
          '<div><div class="cust">'+escapeHtml(o.customer)+'</div><div class="date">'+formatThaiDate(o.date)+'</div></div>'+
          '<div class="amt">'+fmt(o.total)+' บาท</div>'+
        '</div>'+
        '<div class="hist-detail"><table>'+rowsHtml+'</table>'+
          '<div class="hist-actions">'+
            '<button class="reprint">พิมพ์ซ้ำ</button>'+
            '<button class="del">ลบรายการ</button>'+
          '</div>'+
        '</div>';
      row.addEventListener('click', function(e){
        if(e.target.closest('button')) return;
        row.classList.toggle('open');
      });
      row.querySelector('.reprint').addEventListener('click', function(e){
        e.stopPropagation();
        printOrder(o);
      });
      row.querySelector('.del').addEventListener('click', function(e){
        e.stopPropagation();
        if(confirm('ลบใบส่งของนี้?')) deleteOrder(o.id);
      });
      el.histList.appendChild(row);
    });
  }

  function copyMonthTable(){
    var t = buildTables();
    if(t.count===0){ showToast('ไม่มีข้อมูลในเดือนที่เลือก'); return; }
    var rows = [['สรุปรายวัน']].concat(t.daily, [[]], [['สรุปรายลูกค้า']], t.cust, [[]],
                [['ใบส่งของทั้งหมด']], t.bills, [[]], [['รายละเอียดรายการ']], t.details);
    var tsv = rows.map(function(r){ return r.map(function(c){ return c==null?'':String(c); }).join('\t'); }).join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(tsv).then(function(){
        showToast('คัดลอกแล้ว วางใน Excel ได้เลย');
      }).catch(function(){ showToast('คัดลอกไม่สำเร็จ'); });
    }else{
      var ta = document.createElement('textarea');
      ta.value = tsv; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); showToast('คัดลอกแล้ว วางใน Excel ได้เลย'); }
      catch(e){ showToast('คัดลอกไม่สำเร็จ'); }
      ta.remove();
    }
  }

  function loadSheetJS(){
    if(window.XLSX) return Promise.resolve(true);
    return new Promise(function(resolve){
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = function(){ resolve(!!window.XLSX); };
      s.onerror = function(){ resolve(false); };
      document.head.appendChild(s);
    });
  }

  function buildTables(){
    var view = selectedOrders().slice().sort(function(a,b){
      return (a.date===b.date) ? String(a.id).localeCompare(String(b.id)) : a.date.localeCompare(b.date);
    });

    var bills = [['วันที่','เลขที่ใบส่งของ','ลูกค้า','จำนวนรายการ','ยอดรวม (บาท)']];
    var details = [['วันที่','ลูกค้า','เลขที่ใบส่งของ','รายการ','ราคา/หน่วย','จำนวน','รวม (บาท)']];
    var byDay = {};
    var byCust = {};
    var grand = 0;

    view.forEach(function(o){
      bills.push([o.date, o.id, o.customer, o.lines.length, o.total]);
      o.lines.forEach(function(l){
        details.push([o.date, o.customer, o.id, l.name, l.price, l.qty, l.total]);
      });
      grand += o.total;
      if(!byDay[o.date]) byDay[o.date] = {n:0,sum:0};
      byDay[o.date].n++; byDay[o.date].sum += o.total;
      if(!byCust[o.customer]) byCust[o.customer] = {n:0,sum:0};
      byCust[o.customer].n++; byCust[o.customer].sum += o.total;
    });
    bills.push(['','','','รวมทั้งเดือน', grand]);

    var daily = [['วันที่','จำนวนใบส่งของ','ยอดรวม (บาท)']];
    Object.keys(byDay).sort().forEach(function(d){ daily.push([d, byDay[d].n, byDay[d].sum]); });
    daily.push(['รวม', view.length, grand]);

    var cust = [['ลูกค้า','จำนวนใบส่งของ','ยอดรวม (บาท)']];
    Object.keys(byCust).sort().forEach(function(c){ cust.push([c, byCust[c].n, byCust[c].sum]); });
    cust.push(['รวม', view.length, grand]);

    return {bills:bills, details:details, daily:daily, cust:cust, count:view.length, grand:grand};
  }

  function exportFileName(ext){
    var m = el.histMonth.value;
    var tag = (m==='all') ? 'ทุกเดือน' : m;
    return 'รายงานยอดขาย_'+tag+'.'+ext;
  }

  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function toCsv(rows){
    return rows.map(function(r){
      return r.map(function(c){
        var v = (c==null) ? '' : String(c);
        return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
      }).join(',');
    }).join('\r\n');
  }

  function exportCsvFallback(t){
    var rows = [['สรุปรายวัน']].concat(t.daily, [[]], [['สรุปรายลูกค้า']], t.cust, [[]],
                [['ใบส่งของทั้งหมด']], t.bills, [[]], [['รายละเอียดรายการ']], t.details);
    var blob = new Blob(['\uFEFF'+toCsv(rows)], {type:'text/csv;charset=utf-8;'});
    downloadBlob(blob, exportFileName('csv'));
    showToast('ดาวน์โหลดไฟล์ CSV แล้ว (เปิดด้วย Excel ได้)');
  }

  async function exportMonth(){
    var t = buildTables();
    if(t.count===0){ showToast('ไม่มีข้อมูลในเดือนที่เลือก'); return; }
    el.btnExport.disabled = true;
    var old = el.btnExport.textContent;
    el.btnExport.textContent = 'กำลังสร้างไฟล์...';
    try{
      var ok = await loadSheetJS();
      if(ok){
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(t.daily), 'สรุปรายวัน');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(t.cust), 'สรุปรายลูกค้า');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(t.bills), 'ใบส่งของ');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(t.details), 'รายละเอียดรายการ');
        var out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
        downloadBlob(new Blob([out], {type:'application/octet-stream'}), exportFileName('xlsx'));
        showToast('ดาวน์โหลดไฟล์ Excel แล้ว');
      }else{
        exportCsvFallback(t);
      }
    }catch(e){
      exportCsvFallback(t);
    }
    el.btnExport.textContent = old;
    el.btnExport.disabled = false;
  }

  /* ---------- Helpers ---------- */
  function fmt(n){
    return (Math.round((n||0)*100)/100).toLocaleString('th-TH', {minimumFractionDigits: (n%1!==0)?2:0, maximumFractionDigits:2});
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var THAI_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  function formatThaiDate(iso){
    var d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return iso;
    return d.getDate()+' '+THAI_MONTHS[d.getMonth()]+' '+(d.getFullYear()+543);
  }
  var toastTimer;
  function showToast(msg, action){
    el.toast.innerHTML = '';
    el.toast.appendChild(document.createTextNode(msg));
    if(action && action.label && action.onClick){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'toast-btn';
      btn.textContent = action.label;
      btn.addEventListener('click', function(){
        el.toast.classList.remove('show');
        clearTimeout(toastTimer);
        action.onClick();
      });
      el.toast.appendChild(btn);
    }
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.classList.remove('show'); }, action ? 5000 : 2600);
  }

  /* ---------- Init ---------- */
  renderCustList('');
  renderOrder();
})();
</script>
